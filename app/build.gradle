plugins { id 'com.android.application' }

android {
    namespace 'com.missionmode.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.missionmode.android'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}