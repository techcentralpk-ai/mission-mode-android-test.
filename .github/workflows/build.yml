name: Build Mission Mode test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract checked Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import lzma, tarfile, io, base64, hashlib
          parts = [Path(f'payload/part{i}.txt').read_text().strip() for i in range(1,5)]
          data = base64.b64decode(''.join(parts), validate=True)
          expected = 'cc2e517d8ce000dffd2696536d0292cf1e97da495262b8c942049c023cff02fb'
          assert hashlib.sha256(data).hexdigest() == expected, 'Source archive checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(data))) as tar:
              for member in tar.getmembers():
                  assert '..' not in Path(member.name).parts
              tar.extractall(path='.', filter='data')
          print('Android source extracted')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MissionMode-Android-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
