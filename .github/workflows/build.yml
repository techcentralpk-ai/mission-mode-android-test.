name: Build Mission Mode test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract native Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive=Path('Mission_Mode_Android_V1_Source_and_Free_APK_Builder.zip')
          if not archive.exists():
              raise SystemExit('Please upload Mission_Mode_Android_V1_Source_and_Free_APK_Builder.zip to the repository root, then re-run this workflow.')
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Damaged ZIP archive'
              for name in z.namelist():
                  assert not Path(name).is_absolute() and '..' not in Path(name).parts
              z.extractall('.')
          assert Path('app/build.gradle').exists(), 'Android source missing'
          print('Native Android source extracted')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MissionMode-Android-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
