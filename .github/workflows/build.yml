name: Build Mission Mode test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract native Android project
        run: |
          python3 - <<'PY'
          import base64, io, lzma, tarfile
          from pathlib import Path
          archive=base64.b64decode(Path("payload/android-source.b64").read_text().strip(),validate=True)
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive))) as tar:
              for item in tar.getmembers():
                  p=Path(item.name)
                  assert not p.is_absolute() and ".." not in p.parts, "Unsafe archive entry"
              tar.extractall(".",filter="data")
          assert Path("app/build.gradle").exists(), "Android project missing"
          print("Android project extracted successfully")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MissionMode-Android-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
